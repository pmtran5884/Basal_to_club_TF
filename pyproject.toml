[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basal-to-club-tf"
version = "0.1.0"
description = "VIPER-based inference of transcription factors driving the basal to club transition in human airway epithelium"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anndata>=0.10",
  "scanpy>=1.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "tables>=3.9",
  "requests>=2.31",
]

[project.optional-dependencies]
full = ["scvi-tools>=1.1", "harmonypy", "cellrank>=2.0", "decoupler>=1.6",
        "pyviper", "SEACells", "scib-metrics", "rpy2>=3.5"]
dev = ["pytest>=7.4", "pytest-cov", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
