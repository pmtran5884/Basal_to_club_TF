name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyyaml pytest ruff
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        # The logic tests run without any data: resolver behaviour, prior-network
        # sign assignment, gate arithmetic, and config invariants.
        run: pytest -q
      - name: Workflow dry run
        run: |
          pip install snakemake-minimal
          snakemake -n --quiet 2>&1 | tail -20 || true
